<!doctype html>
<!--
  Development-only QA page for the generative-UI renderer:
  http://localhost:3000/genui-harness.html

  Vite's default build input is `index.html` alone, so this entry is served by `vite dev` and is
  absent from the production bundle. See src/genui/harness/main.tsx and src/genui/README.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generative UI — QA harness</title>
    <style>
      html, body { margin: 0; padding: 0; }
      /* The app sets `overflow: hidden` on body for its fixed shell; the harness is a long page. */
      body { overflow-y: auto !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/genui/harness/main.tsx"></script>
  </body>
</html>
